[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-signature-ec-engine"
version = "2.0.0"
description = "Blind-Signature RSA & ECC Anonymous Token Authentication Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
blind-signature-ec-engine = "blind_signature.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/blind-signature-ec-engine"
Repository = "https://github.com/abusuraihsakhri/blind-signature-ec-engine.git"
